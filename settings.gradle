pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // usb-serial-for-android (optional Hamlib rig control) is published on JitPack only
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.mik3y' }
        }
    }
}
rootProject.name = "Rattlegram plus"
include ':app'